<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRONTLINIE – Audio-Test</title>
<style>
  :root { --bg: #14161c; --panel: #1e222b; --fg: #e8e8ec; --dim: #9aa0ad; --acc: #e0b020; --bad: #f87858; --ok: #88e060; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.08em; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: var(--acc); }
  p.hint { color: var(--dim); margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); padding: 10px 12px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  button { background: #2b303b; color: var(--fg); border: 1px solid #3a404d; border-radius: 4px; padding: 7px 8px; font: inherit; cursor: pointer; text-align: left; }
  button:hover { border-color: var(--acc); }
  button.on { background: #4a3a10; border-color: var(--acc); }
  label { display: flex; gap: 6px; align-items: center; }
  #status { color: var(--dim); }
  table { border-collapse: collapse; width: 100%; font: 12px/1.3 ui-monospace, monospace; margin-top: 8px; }
  td, th { border-bottom: 1px solid #2b303b; padding: 3px 6px; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .bad { color: var(--bad); } .ok { color: var(--ok); }
  pre#out { white-space: pre-wrap; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<h1>FRONTLINIE · Audio-Test</h1>
<p class="hint">Alles wird live synthetisiert (js/audio.js). Erster Klick startet den AudioContext. Mit <code>?check</code> in der URL läuft die Offline-Prüfung automatisch.</p>

<div class="bar">
  <label>Musik <input id="vm" type="range" min="0" max="1" step="0.05"></label>
  <label>Effekte <input id="vs" type="range" min="0" max="1" step="0.05"></label>
  <button id="mute">Stumm</button>
  <button id="stop">Musik stoppen</button>
  <button id="check">Offline-Prüfung (alle)</button>
  <span id="status">bereit</span>
</div>

<h2>Musik</h2>
<div class="grid" id="tracks"></div>
<h2>Soundeffekte</h2>
<div class="grid" id="sfx"></div>
<h2>Prüfung</h2>
<div id="result"></div>
<pre id="out"></pre>

<script src="../js/audio.js"></script>
<script>
(function () {
  var A = G.Audio, $ = function (id) { return document.getElementById(id); };
  var status = $('status');
  function first() { A.init(); }
  var v = A.getVolume(); $('vm').value = v.music; $('vs').value = v.sfx;
  $('vm').oninput = $('vs').oninput = function () { first(); A.setVolume(+$('vm').value, +$('vs').value); };
  $('mute').onclick = function () { first(); var m = A.toggleMute(); this.textContent = m ? 'Ton an' : 'Stumm'; };
  $('stop').onclick = function () { A.music(null); mark(); };
  function mark() {
    var cur = A.current();
    Array.prototype.forEach.call($('tracks').children, function (b) { b.classList.toggle('on', b.dataset.t === cur); });
    status.textContent = cur ? 'spielt: ' + cur : 'keine Musik';
  }
  A.TRACKS.forEach(function (t) {
    var b = document.createElement('button'); b.textContent = t; b.dataset.t = t;
    b.onclick = function () { first(); A.music(t); mark(); };
    $('tracks').appendChild(b);
  });
  A.SFX.forEach(function (s) {
    var b = document.createElement('button'); b.textContent = s;
    b.onclick = function () { first(); A.sfx(s); status.textContent = 'Effekt: ' + s; };
    $('sfx').appendChild(b);
  });
  setInterval(mark, 1000);

  // ---- Offline-Prüfung: jeden Track/Effekt rendern, Pegel und Stille messen
  function fmtDb(x) { return x > 0 ? (20 * Math.log10(x)).toFixed(1) : '-inf'; }
  function judge(r, isMusic, loop) {
    var p = [];
    if (r.peak >= 0.99) p.push('Clipping');
    if (r.hotSamples > r.seconds * 44100 * 0.001) p.push('oft am Limit');
    if (isMusic ? r.rms < 0.01 : r.peak < 0.04) p.push('zu leise/still');
    if (isMusic && loop && r.maxSilence > 2.0) p.push('Stille ' + r.maxSilence.toFixed(1) + ' s');
    return p;
  }
  function runCheck() {
    var rows = [], structure = A._check(), jobs = [];
    A.TRACKS.forEach(function (t) { jobs.push('music:' + t); });
    A.SFX.forEach(function (s) { jobs.push('sfx:' + s); });
    var html = '<table><tr><th>Name</th><th>Sek.</th><th>Peak dBFS</th><th>RMS dBFS</th><th>&gt;0.95</th><th>max. Stille</th><th>Befund</th></tr>';
    var t0 = performance.now(), i = 0;
    status.textContent = 'prüfe …';
    function next() {
      if (i >= jobs.length) {
        var bad = rows.filter(function (r) { return r.problems.length; }).length;
        var structErr = structure.filter(function (s) { return s.errors.length; });
        $('result').innerHTML = html + '</table>';
        var summary = { ok: !bad && !structErr.length, problems: bad, structureErrors: structErr, ms: Math.round(performance.now() - t0), rows: rows };
        $('out').textContent = 'AUDIOCHECK ' + JSON.stringify(summary);
        document.title = 'AUDIOCHECK-DONE';
        console.log('AUDIOCHECK ' + JSON.stringify(summary));
        status.textContent = 'Prüfung fertig: ' + (summary.ok ? 'alles in Ordnung' : bad + ' Auffälligkeiten');
        return;
      }
      var job = jobs[i++], isMusic = job.indexOf('music:') === 0;
      var info = isMusic ? structure.filter(function (s) { return 'music:' + s.name === job; })[0] : null;
      A._render(job).then(function (r) {
        var probs = judge(r, isMusic, info && info.loop);
        rows.push({ name: job, seconds: +r.seconds.toFixed(2), peak: +r.peak.toFixed(4), rms: +r.rms.toFixed(4), hot: r.hotSamples, maxSilence: +r.maxSilence.toFixed(2), problems: probs });
        html += '<tr><td>' + job + '</td><td>' + r.seconds.toFixed(1) + '</td><td>' + fmtDb(r.peak) + '</td><td>' + fmtDb(r.rms) + '</td><td>' + r.hotSamples +
          '</td><td>' + r.maxSilence.toFixed(1) + '</td><td class="' + (probs.length ? 'bad' : 'ok') + '">' + (probs.join(', ') || 'ok') + '</td></tr>';
        $('result').innerHTML = html + '</table>';
        next();
      }, function (e) {
        rows.push({ name: job, problems: ['Fehler: ' + e.message] });
        next();
      });
    }
    next();
  }
  $('check').onclick = runCheck;
  if (/[?&]check\b/.test(location.search)) runCheck();
})();
</script>
</body>
</html>
